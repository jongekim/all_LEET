name: Quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:edge
      - run: npm run test:user-data
      - run: npm run test:analytics
      - run: npm run test:schedule
      - run: npm run test:push
      - run: npm run test:e2e:push
      - run: npm run test:e2e
      # 운영 DB에 접근하지 않는 고정 공개 집계 파일로 HTML 생성/화면을 검증한다.
      # 실제 Vercel 빌드는 npm run build로 현재 발행본을 조회한다.
      - run: npm run build:test
      - run: npm run test:prerender
